# Builds the Windows installer/portable exe and the macOS .dmg on GitHub-hosted runners
# (electron-builder can only produce a .dmg on macOS).
# - Run manually (Actions → Build → Run workflow): results are in the run's "Artifacts".
# - Push a tag like v1.0.0: the installers are also published as a GitHub Release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # electron-builder fetches its own Electron for packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOnDesktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AnimeOn Desktop $GITHUB_REF_NAME" \
            --notes "Personal desktop app for watching anime on animeon.cc. Unofficial, not affiliated with animeon.cc.

          **Windows**
          - \`AnimeOnDesktop-Setup-*.exe\`: installer (per-user, desktop and Start-menu shortcuts)
          - \`AnimeOnDesktop-Portable-*.exe\`: portable, no installation

          Not code-signed: on first run SmartScreen may warn, click **More info → Run anyway**.

          **macOS** (12+, Intel and Apple Silicon)
          - \`AnimeOnDesktop-*-mac.dmg\`: drag the app to Applications

          Not notarized: open it the first time with right-click → **Open** (macOS 15+: System Settings → Privacy & Security → **Open Anyway**)."
