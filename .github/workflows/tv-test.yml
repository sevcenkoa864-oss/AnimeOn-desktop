# Boots an Android emulator with a TV-sized screen, installs the debug build of the TV app and drives it with
# D-pad key events like a remote. Screenshots and a report are saved as the "tv-emulator" artifact.
# Run it manually: Actions → TV emulator test → Run workflow.
name: TV emulator test

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: node scripts/make-icons.mjs
      - run: gradle -p tv assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tv/ci/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-emulator
          path: tv-shots
